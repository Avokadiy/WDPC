plugins { id 'com.android.application' }

android {
    namespace 'dev.wdpc.remote'
    compileSdk 34

    defaultConfig {
        applicationId "dev.wdpc.remote"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        wdpc {
            storeFile file("../wdpc-release.jks")
            storePassword "wdpc12345"
            keyAlias "wdpc"
            keyPassword "wdpc12345"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.wdpc
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
